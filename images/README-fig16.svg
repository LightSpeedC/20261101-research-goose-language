<rect x="185" y="252" width="370" height="58" rx="8"/><rect x="570" y="252" width="310" height="58" rx="8"/>
<rect x="185" y="322" width="370" height="58" rx="8"/><rect x="570" y="322" width="310" height="58" rx="8"/>
