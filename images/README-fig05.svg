<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="スコープ入退場とデータスタック">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(217,78%,25%)"/><stop offset="1" stop-color="hsl(217,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<marker id="i4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a51f22"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<g class="k" fill="#1c2330" text-anchor="middle">
<text x="155" y="30" font-size="16" font-weight="700">① スコープに入る</text>
<text x="450" y="30" font-size="16" font-weight="700">② push で伸びる</text>
<text x="745" y="30" font-size="16" font-weight="700">③ スコープを抜ける</text>
</g>
<rect x="95" y="50" width="120" height="200" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect x="390" y="50" width="120" height="200" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect x="685" y="50" width="120" height="200" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<rect x="390" y="130" width="120" height="120" rx="6" fill="url(#i1)"/>
<rect x="685" y="130" width="120" height="120" rx="6" fill="#e8edf7" stroke="#94a3b8" stroke-dasharray="7 5"/>
<g class="t" fill="#fff" text-anchor="middle"><text x="450" y="196" font-size="15" font-weight="700">scratch</text></g>
<g class="s" fill="#4a5568" text-anchor="middle"><text x="745" y="196" font-size="13">(領域は残るが</text><text x="745" y="216" font-size="13">もう読めない)</text></g>
<line x1="240" y1="250" x2="218" y2="250" stroke="#1d7a3c" stroke-width="3.5" marker-end="url(#i4)"/>
<line x1="535" y1="130" x2="513" y2="130" stroke="#1d7a3c" stroke-width="3.5" marker-end="url(#i4)"/>
<line x1="830" y1="250" x2="808" y2="250" stroke="#a51f22" stroke-width="3.5" marker-end="url(#i4)"/>
<g class="k" fill="#1c2330" text-anchor="start"><text x="242" y="246" font-size="13">top</text><text x="537" y="126" font-size="13">top</text><text x="832" y="246" font-size="13">top</text></g>
<g class="k" fill="#1c2330" text-anchor="middle"><text x="155" y="276" font-size="13">top は底</text><text x="450" y="276" font-size="13">top を進めただけ</text><text x="745" y="276" font-size="13">top を戻す 1 回の書き込みで解放</text></g>
</svg>
