<g class="k" fill="#1c2330" text-anchor="start">
<text x="199" y="76" font-size="13">規律・サニタイザ・スマートポインタ</text><text x="199" y="94" font-size="12">言語としては防がない</text>
<text x="584" y="76" font-size="13">未定義動作になりうる</text>
<text x="199" y="146" font-size="13">借用チェッカとライフタイム注釈</text><text x="199" y="164" font-size="12">コンパイル時に拒否する</text>
<text x="584" y="146" font-size="13">注釈と設計の制約を負う</text><text x="584" y="164" font-size="12">(<tspan>unsafe</tspan> は別の話)</text>
<text x="199" y="216" font-size="13">ルート推論 (注釈なし) と、動かない要素</text><text x="199" y="234" font-size="12">コンパイル時に拒否する</text>
<text x="584" y="216" font-size="13">所有者とスコープを意識する</text><text x="584" y="234" font-size="12">再帰・添字・クロージャに制約</text>
<text x="199" y="286" font-size="13">GC が、参照されている間は保持する</text>
<text x="584" y="286" font-size="13">GC の実行コスト</text>
<text x="199" y="356" font-size="13">GC が、参照されている間は保持する</text>
<text x="584" y="356" font-size="13">GC の実行コストと動的型の検査</text>
</g>
</svg>
