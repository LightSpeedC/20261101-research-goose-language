<g class="k" fill="#1c2330" text-anchor="start"><text x="590" y="262" font-size="13">データスタック = 大きなアドレス空間の予約 + バンプポインタ</text><text x="590" y="284" font-size="13">同時に伸縮できる値はスタックごとに 1 つ (常に最上部)</text><text x="590" y="306" font-size="13">→ 伸びても何も動かない・容量チェックも不要</text></g>
