<g fill="none" stroke="#b8620a" stroke-width="4" stroke-linecap="round">
<path d="M630 246 L630 210" marker-end="url(#i4)"/><path d="M630 150 L630 114" marker-end="url(#i4)"/>
</g>
<g class="k" fill="#1c2330" text-anchor="start"><text x="646" y="234" font-size="13" style="fill:#b8620a" font-weight="700">Err を返す</text><text x="646" y="138" font-size="13" style="fill:#b8620a" font-weight="700">? で伝播</text><text x="750" y="190" font-size="12">各段が</text><text x="750" y="208" font-size="12">Result を返す型</text></g>
