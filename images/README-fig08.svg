<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="配列型の 5 種類">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(240,78%,25%)"/><stop offset="1" stop-color="hsl(240,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/></linearGradient>
<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/></linearGradient>
<linearGradient id="i5" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(30,78%,25%)"/><stop offset="1" stop-color="hsl(30,58%,55%)"/></linearGradient>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<g class="t" fill="#fff">
<rect x="20" y="14" width="860" height="62" rx="10" fill="url(#i1)"/>
<text x="40" y="53" font-size="22" font-weight="700">T[k]</text><text x="260" y="53" font-size="15">固定長。サイズはコンパイル時に決まる</text>
<rect x="20" y="86" width="860" height="62" rx="10" fill="url(#i2)"/>
<text x="40" y="125" font-size="22" font-weight="700">T[] ・ T[varint]</text><text x="260" y="125" font-size="15">構築時にサイズが決まり、以後は固定 (長さは固定幅または可変幅)</text>
<rect x="20" y="158" width="860" height="62" rx="10" fill="url(#i3)"/>
<text x="40" y="197" font-size="22" font-weight="700">T[..k] ・ T[..]</text><text x="260" y="197" font-size="15">容量を内側に持ち、その範囲で伸び縮みする</text>
<rect x="20" y="230" width="860" height="62" rx="10" fill="url(#i4)"/>
<text x="40" y="269" font-size="22" font-weight="700">T[&gt;..]</text><text x="260" y="269" font-size="15">伸長のみ。参照は有効なまま。もっともよく使う種類</text>
<rect x="20" y="302" width="860" height="62" rx="10" fill="url(#i5)"/>
<text x="40" y="341" font-size="22" font-weight="700">T[&gt;..&lt;]</text><text x="260" y="341" font-size="15">伸縮可能。スタック・キュー・ヒープ向け</text>
</g>
</svg>
