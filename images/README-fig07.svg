<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="参照のルートとスコープ">
<defs>
<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/></linearGradient>
<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(30,78%,25%)"/><stop offset="1" stop-color="hsl(30,58%,55%)"/></linearGradient>
<marker id="i4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a51f22"/></marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="290" rx="12" fill="#eef2fb" stroke="#2f5fbf" stroke-width="2"/>
<g class="k" fill="#1c2330" text-anchor="start"><text x="36" y="46" font-size="15" font-weight="700">外側のスコープ</text></g>
<rect x="400" y="62" width="460" height="230" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
<g class="k" fill="#1c2330" text-anchor="start"><text x="416" y="86" font-size="15" font-weight="700">内側のスコープ { ... }</text></g>
<g class="t" fill="#fff" text-anchor="middle">
<rect x="50" y="76" width="260" height="62" rx="10" fill="url(#i1)"/><text x="180" y="114" font-size="16" font-weight="700">var outer (配列)</text>
<rect x="50" y="206" width="260" height="62" rx="10" fill="url(#i2)"/><text x="180" y="244" font-size="16" font-weight="700">var w (外側の参照)</text>
<rect x="450" y="106" width="260" height="62" rx="10" fill="url(#i3)"/><text x="580" y="144" font-size="16" font-weight="700">var inner (配列)</text>
</g>
<path d="M450 160 C380 190 360 230 314 238" fill="none" stroke="#a51f22" stroke-width="4" stroke-dasharray="9 6" marker-end="url(#i4)"/>
<g class="r" fill="#a51f22" text-anchor="start"><text x="440" y="214" font-size="14" font-weight="700">w = longest(outer, inner)</text><text x="440" y="238" font-size="14">root は inner → 内側で先に消える</text></g>
<rect x="520" y="252" width="180" height="30" rx="6" fill="#a51f22"/>
<g class="t" fill="#fff" text-anchor="middle"><text x="610" y="273" font-size="14" font-weight="700">コンパイルエラー</text></g>
</svg>
