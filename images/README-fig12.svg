</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
<g class="k" fill="#1c2330" text-anchor="middle"><text x="225" y="28" font-size="17" font-weight="700">Goose: return E from load</text><text x="675" y="28" font-size="17" font-weight="700">Rust: Result と ? を各段に書く</text></g>
<line x1="450" y1="44" x2="450" y2="326" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
<g class="t" fill="#fff" text-anchor="middle">
<rect x="70" y="54" width="220" height="56" rx="8" fill="url(#i1)"/><text x="180" y="88" font-size="15" font-weight="700">load</text>
<rect x="70" y="150" width="220" height="56" rx="8" fill="url(#i1)"/><text x="180" y="184" font-size="15" font-weight="700">each_split</text>
<rect x="70" y="246" width="220" height="56" rx="8" fill="url(#i1)"/><text x="180" y="280" font-size="15" font-weight="700">parse_user</text>
<rect x="520" y="54" width="220" height="56" rx="8" fill="url(#i2)"/><text x="630" y="88" font-size="15" font-weight="700">load</text>
<rect x="520" y="150" width="220" height="56" rx="8" fill="url(#i2)"/><text x="630" y="184" font-size="15" font-weight="700">each_split</text>
<rect x="520" y="246" width="220" height="56" rx="8" fill="url(#i2)"/><text x="630" y="280" font-size="15" font-weight="700">parse_user</text>
</g>
<path d="M70 274 C14 250 14 120 66 84" fill="none" stroke="#1d7a3c" stroke-width="4.5" marker-end="url(#i3)"/>
